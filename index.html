  nombre: v => {
    if (!v || !v.trim()) return "Requerido";

    return null;
  },
  text: (v, min = 2, max = 100) => {
    if (!v || !v.trim()) return null; // optional by default
    if (v.trim().length < min) return "Mínimo " + min + " caracteres";
    if (v.trim().length > max) return "Máximo " + max + " caracteres";
    return null;
  },

    if (!v || !v.trim()) return "Requerido";

    if (!v || !v.trim()) return "Requerido";

    return null;

    return null;

    return null;

    if (!v && v !== 0) return "Requerido";

    if (isInt && !Number.isInteger(n)) return "Solo números enteros";
    return null;
  }

// Add data-nav="groupId" to inputs; ↑↓ moves focus, Enter advances or saves.
function useNavKey(groupId, save) {
  // Arrow navigation is now handled globally (setupGlobalNav).
  // This hook only handles Enter → advance or save.
  return useCallback(e => {
    if (e.key === "Enter") {
      e.preventDefault();
      const all = [...document.querySelectorAll(`[data-nav="${groupId}"]`)];
      const i = all.indexOf(e.currentTarget);
      if (i < all.length - 1) {
        all[i + 1] && all[i + 1].focus();
      } else {
        save();
      }
    }
  }, [groupId, save]);
}

// All 4 arrows navigate between fields everywhere in the app.
// ↑↓  → always move between fields (all text-type inputs)
// ←→  → move between fields for number inputs, or when cursor is at boundary for text
