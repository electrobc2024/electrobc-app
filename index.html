<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELECTRO BC – Sistema de Presupuestos</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;padding:0;">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;


if (typeof document !== "undefined") {
  const lk = document.createElement("link");
  lk.href = "https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Oswald:wght@600;700&display=swap";
  lk.rel = "stylesheet"; document.head.appendChild(lk);
  const st = document.createElement("style");
  st.textContent = `
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{height:100%;overflow:hidden}
    body{font-family:'Inter Tight',system-ui,sans-serif;background:#EEF0F5;color:#1E293B;font-size:14px}
    input,select,textarea,button{font-family:'Inter Tight',system-ui,sans-serif}
    input:focus,select:focus,textarea:focus{outline:2px solid #F26B1D;outline-offset:-1px}
    button{cursor:pointer}
    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:4px}
    @media print{.no-print{display:none!important}body,#root{overflow:visible!important;height:auto!important}}
  `;
  document.head.appendChild(st);
}

const NAVY="#0A0F1E", ORANGE="#F26B1D";
const SKEY="ebc-quotes-v3", CKEY="ebc-catalog-v2", CLKEY="ebc-clients-v1";
const STATUS_MAP={
  borrador: {label:"Borrador",   fg:"#6B7280",bg:"#F3F4F6",br:"#D1D5DB"},
  enviado:  {label:"Enviado",    fg:"#1D4ED8",bg:"#EFF6FF",br:"#93C5FD"},
  revision: {label:"En revisión",fg:"#B45309",bg:"#FFFBEB",br:"#FCD34D"},
  aprobado: {label:"Aprobado",   fg:"#065F46",bg:"#ECFDF5",br:"#6EE7B7"},
  rechazado:{label:"Rechazado",  fg:"#991B1B",bg:"#FFF1F2",br:"#FCA5A5"},
};

const db={
  get:async(k)=>{
    if(typeof window!=="undefined"&&window.storage)try{return await window.storage.get(k);}catch{}
    try{const v=localStorage.getItem(k);return v?{value:v}:null;}catch{return null;}
  },
  set:async(k,v)=>{
    if(typeof window!=="undefined"&&window.storage)try{await window.storage.set(k,v);return;}catch{}
    try{localStorage.setItem(k,v);}catch{}
  },
};

const uid=()=>Math.random().toString(36).slice(2,9);
const todayStr=()=>new Date().toISOString().slice(0,10);
const fmt=(n)=>parseFloat(n||0).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
const calcSub=(rows)=>rows.reduce((s,r)=>s+parseFloat(r.pu||0)*parseFloat(r.qty||0),0);
const mkRow=()=>({id:uid(),catId:"",desc:"",pu:"",qty:1});
const mkQuote=(n)=>({id:uid(),numero:n,fecha:todayStr(),
  cliente:{nombre:"",empresa:"",direccion:"",telefono:""},
  mdo:[mkRow()],mat:[mkRow()],aclaraciones:"",status:"borrador",
  pagos:{pago1:"",fechaPago1:"",fechaPago2:""},createdAt:new Date().toISOString()});
const mkClient=()=>({id:uid(),nombre:"",empresa:"",direccion:"",telefono:""});

function validate(q){
  const e=[];
  if(!q.cliente.nombre.trim())   e.push("Nombre y Apellido del cliente");
  if(!q.cliente.empresa.trim())  e.push("Empresa del cliente");
  if(!q.cliente.direccion.trim())e.push("Dirección del cliente");
  if(!q.cliente.telefono.trim()) e.push("Teléfono del cliente");
  if(!q.mdo.some(r=>r.desc.trim()&&parseFloat(r.pu)>0))e.push("Al menos 1 ítem en Mano de Obra");
  if(!q.mat.some(r=>r.desc.trim()&&parseFloat(r.pu)>0))e.push("Al menos 1 ítem en Materiales");
  return e;
}

const loadQ =async()=>{try{const r=await db.get(SKEY); return r?JSON.parse(r.value):[];}catch{return[];}};
const saveQ =async(d)=>{try{await db.set(SKEY, JSON.stringify(d));}catch{}};
const loadCat=async()=>{try{const r=await db.get(CKEY); return r?JSON.parse(r.value):{mdo:[],mat:[]};}catch{return{mdo:[],mat:[]};}};
const saveCat=async(d)=>{try{await db.set(CKEY, JSON.stringify(d));}catch{}};
const loadCl =async()=>{try{const r=await db.get(CLKEY);return r?JSON.parse(r.value):[];}catch{return[];}};
const saveCl =async(d)=>{try{await db.set(CLKEY,JSON.stringify(d));}catch{}};

const Badge=({status})=>{const c=STATUS_MAP[status]||STATUS_MAP.borrador;
  return <span style={{display:"inline-block",fontSize:10,fontWeight:700,letterSpacing:"0.05em",
    textTransform:"uppercase",padding:"3px 9px",borderRadius:20,
    backgroundColor:c.bg,color:c.fg,border:`1px solid ${c.br}`}}>{c.label}</span>;};

const Label=({children,req})=>(
  <label style={{fontSize:10,fontWeight:700,color:"#94A3B8",textTransform:"uppercase",
    letterSpacing:"0.08em",display:"block",marginBottom:5}}>
    {children}{req&&<span style={{color:ORANGE,marginLeft:2}}>*</span>}
  </label>);

const CardBox=({title,accent,children,required})=>(
  <div style={{backgroundColor:"#fff",borderRadius:12,border:"1px solid #E2E8F0",marginBottom:14,overflow:"hidden"}}>
    <div style={{display:"flex",alignItems:"center",gap:8,padding:"11px 18px",
      borderBottom:"1px solid #F1F5F9",borderLeft:`3px solid ${accent||ORANGE}`}}>
      <span style={{fontFamily:"'Oswald',system-ui",fontSize:11,fontWeight:700,
        color:accent||NAVY,textTransform:"uppercase",letterSpacing:"0.12em"}}>{title}</span>
      {required&&<span style={{fontSize:10,color:ORANGE,fontWeight:600}}>* requerido</span>}
    </div>
    <div style={{padding:"16px 18px"}}>{children}</div>
  </div>);

const Inp=({style:st,...p})=>(
  <input {...p} style={{width:"100%",border:"1px solid #E2E8F0",borderRadius:7,
    padding:"8px 11px",fontSize:13,color:"#1E293B",backgroundColor:"#fff",...st}}/>);

const BtnP=({children,style:st,...p})=>(
  <button {...p} style={{backgroundColor:ORANGE,color:"#fff",border:"none",borderRadius:8,
    padding:"9px 20px",fontSize:13,fontWeight:700,...st}}>{children}</button>);
const BtnS=({children,style:st,...p})=>(
  <button {...p} style={{backgroundColor:"#fff",color:"#475569",border:"1px solid #E2E8F0",
    borderRadius:8,padding:"9px 16px",fontSize:13,fontWeight:500,...st}}>{children}</button>);

// KEY FIX: position:absolute;inset:0 on scroll pane prevents scroll-to-top on re-render
const Pane=({children})=>(
  <div style={{position:"absolute",inset:0,overflowY:"auto",padding:"16px 20px 48px"}}>
    {children}
  </div>);

const H1=({children})=>(
  <h1 style={{fontFamily:"'Oswald',system-ui",fontSize:22,fontWeight:700,color:NAVY,
    letterSpacing:"-0.01em",marginBottom:18}}>{children}</h1>);

// ── ItemsTable ────────────────────────────────────────────────────────────────
function ItemsTable({rows,onChange,catalog=[]}) {
  const setRow=useCallback((id,f,v)=>onChange(rows.map(r=>r.id===id?{...r,[f]:v}:r)),[rows,onChange]);
  const pickCat=useCallback((rowId,catId)=>{
    if(catId==="__custom__"){onChange(rows.map(r=>r.id===rowId?{...r,catId:"",desc:"",pu:""}:r));}
    else{const i=catalog.find(c=>c.id===catId);if(i)onChange(rows.map(r=>r.id===rowId?{...r,catId,desc:i.nombre,pu:i.precioBase||r.pu||""}:r));}
  },[rows,onChange,catalog]);
  const addRow=useCallback(()=>onChange([...rows,mkRow()]),[rows,onChange]);
  const delRow=useCallback((id)=>{if(rows.length>1)onChange(rows.filter(r=>r.id!==id));},[rows,onChange]);
  const sub=calcSub(rows);

  const thS={padding:"7px 10px",fontSize:10,fontWeight:700,color:"#94A3B8",textTransform:"uppercase",
    letterSpacing:"0.07em",borderBottom:"1px solid #E2E8F0",backgroundColor:"#F8FAFC",whiteSpace:"nowrap"};
  const tdS={padding:"6px 10px",borderBottom:"1px solid #F1F5F9",verticalAlign:"middle"};
  const iS={border:"none",outline:"none",width:"100%",fontSize:12,backgroundColor:"transparent",color:"#1E293B",padding:"2px 0"};

  return (
    <div>
      <table style={{width:"100%",borderCollapse:"collapse",tableLayout:"fixed"}}>
        <colgroup>
          <col style={{width:26}}/><col/><col style={{width:100}}/><col style={{width:64}}/><col style={{width:100}}/><col style={{width:28}}/>
        </colgroup>
        <thead>
          <tr>
            <th style={{...thS,textAlign:"center"}}>#</th>
            <th style={thS}>Descripción</th>
            <th style={{...thS,textAlign:"right"}}>P.Unit.</th>
            <th style={{...thS,textAlign:"right"}}>Cant.</th>
            <th style={{...thS,textAlign:"right"}}>Total</th>
            <th style={thS}></th>
          </tr>
        </thead>
        <tbody>
          {rows.map((r,i)=>{
            const isC=!r.catId, total=parseFloat(r.pu||0)*parseFloat(r.qty||0);
            return (
              <tr key={r.id}>
                <td style={{...tdS,textAlign:"center",color:"#CBD5E1",fontSize:11}}>{i+1}</td>
                <td style={tdS}>
                  <select value={r.catId||"__custom__"} onChange={e=>pickCat(r.id,e.target.value)}
                    style={{width:"100%",border:"1px solid #E2E8F0",borderRadius:6,padding:"5px 8px",
                      fontSize:12,color:"#1E293B",backgroundColor:"#fff",marginBottom:isC?4:0}}>
                    <option value="__custom__">✏ Descripción personalizada</option>
                    {catalog.length>0&&<optgroup label="── Catálogo ──">
                      {catalog.map(c=><option key={c.id} value={c.id}>{c.nombre}</option>)}
                    </optgroup>}
                  </select>
                  {isC&&<input value={r.desc} onChange={e=>setRow(r.id,"desc",e.target.value)}
                    style={iS} placeholder="Escribí la descripción…"/>}
                </td>
                <td style={{...tdS,textAlign:"right"}}>
                  <input value={r.pu} onChange={e=>setRow(r.id,"pu",e.target.value)}
                    style={{...iS,textAlign:"right",fontVariantNumeric:"tabular-nums"}}
                    type="number" min="0" step="0.01" placeholder="0,00"/>
                </td>
                <td style={{...tdS,textAlign:"right"}}>
                  <input value={r.qty} onChange={e=>setRow(r.id,"qty",e.target.value)}
                    style={{...iS,textAlign:"right"}} type="number" min="0" step="0.01"/>
                </td>
                <td style={{...tdS,textAlign:"right",fontWeight:600,color:NAVY,
                  whiteSpace:"nowrap",fontVariantNumeric:"tabular-nums"}}>$ {fmt(total)}</td>
                <td style={tdS}>
                  <button onClick={()=>delRow(r.id)}
                    style={{background:"none",border:"none",color:"#CBD5E1",fontSize:14,padding:"2px"}}>✕</button>
                </td>
              </tr>
            );
          })}
        </tbody>
        <tfoot>
          <tr style={{backgroundColor:"#F8FAFC"}}>
            <td colSpan={4} style={{padding:"8px 10px",fontSize:10,fontWeight:700,color:"#64748B",
              textTransform:"uppercase",letterSpacing:"0.08em"}}>SUBTOTAL</td>
            <td style={{padding:"8px 10px",textAlign:"right",fontWeight:700,fontSize:13,
              color:NAVY,whiteSpace:"nowrap",fontVariantNumeric:"tabular-nums"}}>$ {fmt(sub)}</td>
            <td></td>
          </tr>
        </tfoot>
      </table>
      <button onClick={addRow} style={{marginTop:8,width:"100%",background:"none",
        border:"1px dashed #CBD5E1",borderRadius:6,padding:"7px",fontSize:12,color:"#64748B"}}>
        + Agregar ítem
      </button>
    </div>
  );
}

// ── CatalogView ───────────────────────────────────────────────────────────────
function CatalogView({title,items,onSave}) {
  const [nombre,setNombre]=useState(""),  [precio,setPrecio]=useState(""), [editId,setEditId]=useState(null);
  const add=()=>{
    if(!nombre.trim())return;
    const up=editId?items.map(i=>i.id===editId?{...i,nombre:nombre.trim(),precioBase:precio}:i)
      :[...items,{id:uid(),nombre:nombre.trim(),precioBase:precio}];
    onSave(up); setNombre(""); setPrecio(""); setEditId(null);
  };
  const del=(id)=>onSave(items.filter(i=>i.id!==id));
  const ed=(i)=>{setEditId(i.id);setNombre(i.nombre);setPrecio(i.precioBase||"");};
  const thS={padding:"9px 12px",fontSize:10,fontWeight:700,color:"#94A3B8",textTransform:"uppercase",
    letterSpacing:"0.08em",backgroundColor:"#F8FAFC",borderBottom:"1px solid #E2E8F0"};
  return (
    <Pane>
      <H1>{title}</H1>
      <CardBox title={editId?"Editar ítem":"Nuevo ítem"}>
        <div style={{display:"grid",gridTemplateColumns:"1fr auto auto",gap:8}}>
          <Inp value={nombre} onChange={e=>setNombre(e.target.value)}
            placeholder="Nombre (ej: Cambio de disyuntor 2x40A)" onKeyDown={e=>e.key==="Enter"&&add()}/>
          <Inp value={precio} onChange={e=>setPrecio(e.target.value)} placeholder="Precio base"
            type="number" min="0" step="0.01" onKeyDown={e=>e.key==="Enter"&&add()} st={{width:120}}/>
          <BtnP onClick={add}>{editId?"Guardar":"+ Agregar"}</BtnP>
        </div>
        {editId&&<button onClick={()=>{setEditId(null);setNombre("");setPrecio("");}}
          style={{marginTop:8,fontSize:12,color:"#94A3B8",background:"none",border:"none"}}>Cancelar</button>}
      </CardBox>
      {items.length===0?(
        <div style={{textAlign:"center",padding:"48px",color:"#94A3B8",fontSize:14}}>Sin ítems todavía.</div>
      ):(
        <div style={{backgroundColor:"#fff",borderRadius:12,border:"1px solid #E2E8F0",overflow:"hidden"}}>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead><tr>
              <th style={{...thS,textAlign:"left"}}>Nombre</th>
              <th style={{...thS,textAlign:"right",width:130}}>Precio base</th>
              <th style={{...thS,textAlign:"center",width:110}}>Acciones</th>
            </tr></thead>
            <tbody>
              {items.map((item,i)=>(
                <tr key={item.id} style={{backgroundColor:i%2===0?"#fff":"#FAFAFA"}}>
                  <td style={{padding:"10px 12px",fontSize:13,fontWeight:500}}>{item.nombre}</td>
                  <td style={{padding:"10px 12px",fontSize:13,color:"#64748B",textAlign:"right",fontVariantNumeric:"tabular-nums"}}>
                    {item.precioBase?`$ ${fmt(item.precioBase)}`:"—"}</td>
                  <td style={{padding:"10px 12px",textAlign:"center"}}>
                    <div style={{display:"flex",gap:4,justifyContent:"center"}}>
                      <button onClick={()=>ed(item)} style={{background:"none",border:"1px solid #E2E8F0",
                        borderRadius:5,padding:"4px 10px",fontSize:11,color:"#475569"}}>Editar</button>
                      <button onClick={()=>del(item.id)} style={{background:"none",border:"1px solid #FECACA",
                        borderRadius:5,padding:"4px 10px",fontSize:11,color:"#DC2626"}}>✕</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </Pane>
  );
}

// ── ClientesView ──────────────────────────────────────────────────────────────
function ClientesView({clients,onSave}) {
  const [form,setForm]=useState(mkClient()), [editId,setEditId]=useState(null);
  const updF=(f,v)=>setForm(c=>({...c,[f]:v}));
  const save=()=>{
    if(!form.nombre.trim())return;
    const up=editId?clients.map(c=>c.id===editId?{...form}:c):[...clients,{...form,id:uid()}];
    onSave(up); setForm(mkClient()); setEditId(null);
  };
  const del=(id)=>{if(!confirm("¿Eliminar?"))return;onSave(clients.filter(c=>c.id!==id));};
  const ed=(c)=>{setEditId(c.id);setForm({...c});};
  return (
    <Pane>
      <H1>Clientes</H1>
      <CardBox title={editId?"Editar cliente":"Nuevo cliente"}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
          {[{f:"nombre",label:"Nombre y Apellido",req:true,ph:"Juan García"},
            {f:"empresa",label:"Empresa",ph:"Empresa S.A."},
            {f:"direccion",label:"Dirección",ph:"Av. Corrientes 1234, CABA"},
            {f:"telefono",label:"Teléfono",ph:"+54 11 1234-5678"}].map(({f,label,req,ph})=>(
            <div key={f}>
              <Label req={req}>{label}</Label>
              <Inp value={form[f]} onChange={e=>updF(f,e.target.value)} placeholder={ph} onKeyDown={e=>e.key==="Enter"&&save()}/>
            </div>
          ))}
        </div>
        <div style={{display:"flex",gap:8}}>
          <BtnP onClick={save}>{editId?"Guardar cambios":"+ Agregar cliente"}</BtnP>
          {editId&&<BtnS onClick={()=>{setEditId(null);setForm(mkClient());}}>Cancelar</BtnS>}
        </div>
      </CardBox>
      {clients.length===0?(
        <div style={{textAlign:"center",padding:"48px",color:"#94A3B8",fontSize:14}}>Sin clientes todavía.</div>
      ):(
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:12}}>
          {clients.map(cl=>(
            <div key={cl.id} style={{backgroundColor:"#fff",borderRadius:12,border:"1px solid #E2E8F0",padding:"14px 16px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                <div>
                  <div style={{fontWeight:700,fontSize:14,color:NAVY}}>{cl.nombre}</div>
                  {cl.empresa&&<div style={{fontSize:12,color:"#64748B",marginTop:1}}>{cl.empresa}</div>}
                </div>
                <div style={{display:"flex",gap:4}}>
                  <button onClick={()=>ed(cl)} style={{background:"none",border:"1px solid #E2E8F0",
                    borderRadius:5,padding:"4px 8px",fontSize:11,color:"#475569"}}>✏</button>
                  <button onClick={()=>del(cl.id)} style={{background:"none",border:"1px solid #FECACA",
                    borderRadius:5,padding:"4px 8px",fontSize:11,color:"#DC2626"}}>✕</button>
                </div>
              </div>
              {(cl.direccion||cl.telefono)&&(
                <div style={{borderTop:"1px solid #F1F5F9",paddingTop:8,display:"flex",flexDirection:"column",gap:3}}>
                  {cl.direccion&&<div style={{fontSize:12,color:"#64748B"}}>📍 {cl.direccion}</div>}
                  {cl.telefono &&<div style={{fontSize:12,color:"#64748B"}}>📞 {cl.telefono}</div>}
                </div>
              )}
            </div>
          ))}
        </div>
      )}
    </Pane>
  );
}

// ── PrintDoc ──────────────────────────────────────────────────────────────────
function PrintDoc({q}) {
  const subMdo=calcSub(q.mdo),subMat=calcSub(q.mat),total=subMdo+subMat;
  const PS=({title,rows,sub})=>(
    <div style={{marginBottom:22}}>
      <div style={{fontSize:10,fontWeight:700,color:"#64748B",textTransform:"uppercase",
        letterSpacing:"0.1em",marginBottom:6,borderLeft:`3px solid ${ORANGE}`,paddingLeft:8}}>{title}</div>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
        <thead><tr style={{backgroundColor:"#F1F5F9"}}>
          {["Ítem","Descripción","P.Unit.","Cant.","Total"].map((h,i)=>(
            <th key={i} style={{padding:"6px 10px",fontSize:10,fontWeight:700,color:"#64748B",
              textTransform:"uppercase",letterSpacing:"0.06em",border:"1px solid #E2E8F0",
              textAlign:i>=2?"right":i===0?"center":"left",...(i===0?{width:36}:{})}}>{h}</th>
          ))}
        </tr></thead>
        <tbody>{rows.map((r,i)=>{const t=parseFloat(r.pu||0)*parseFloat(r.qty||0);return(
          <tr key={r.id} style={{backgroundColor:i%2===0?"#fff":"#FAFAFA"}}>
            <td style={{padding:"6px 10px",textAlign:"center",color:"#94A3B8",border:"1px solid #E2E8F0"}}>{i+1}</td>
            <td style={{padding:"6px 10px",border:"1px solid #E2E8F0"}}>{r.desc||"—"}</td>
            <td style={{padding:"6px 10px",textAlign:"right",border:"1px solid #E2E8F0"}}>$ {fmt(r.pu)}</td>
            <td style={{padding:"6px 10px",textAlign:"right",border:"1px solid #E2E8F0"}}>{r.qty}</td>
            <td style={{padding:"6px 10px",textAlign:"right",fontWeight:600,border:"1px solid #E2E8F0"}}>$ {fmt(t)}</td>
          </tr>);})}
        </tbody>
        <tfoot><tr style={{backgroundColor:"#F8FAFC"}}>
          <td colSpan={4} style={{padding:"7px 10px",fontWeight:700,fontSize:11,color:"#475569",
            textTransform:"uppercase",letterSpacing:"0.06em",border:"1px solid #E2E8F0"}}>SUBTOTAL | {title}</td>
          <td style={{padding:"7px 10px",textAlign:"right",fontWeight:800,color:NAVY,fontSize:13,border:"1px solid #E2E8F0"}}>$ {fmt(sub)}</td>
        </tr></tfoot>
      </table>
    </div>
  );
  return (
    <div style={{backgroundColor:"#fff",padding:"40px 48px",maxWidth:760,margin:"0 auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",
        borderBottom:`3px solid ${NAVY}`,paddingBottom:20,marginBottom:26}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <svg viewBox="0 0 48 48" fill="none" style={{width:44,height:44,flexShrink:0}}>
            <ellipse cx="24" cy="26" rx="20" ry="8" stroke={NAVY} strokeWidth="2" fill="none" transform="rotate(-20 24 26)"/>
            <path d="M28 5 L16 26 H23 L20 43 L32 22 H25 Z" fill={ORANGE}/>
          </svg>
          <div>
            <div style={{fontFamily:"'Oswald',system-ui",fontSize:24,fontWeight:700,color:NAVY,lineHeight:1}}>ELECTRO BC</div>
            <div style={{fontSize:9,color:"#94A3B8",letterSpacing:"0.2em",textTransform:"uppercase",marginTop:4}}>SERVICIOS INTEGRALES</div>
          </div>
        </div>
        <div style={{textAlign:"right"}}>

// ── QuoteForm ─────────────────────────────────────────────────────────────────
function QuoteForm({quote,setQuote,onSave,saving,savedFlash,catalog,clients}) {
  const [errors,setErrors]=useState([]), [touched,setTouch]=useState({});
  const upd=(f,v)=>setQuote(q=>({...q,[f]:v}));
  const updCli=(f,v)=>{setTouch(t=>({...t,[f]:true}));setQuote(q=>({...q,cliente:{...q.cliente,[f]:v}}));};
  const updMdo=useCallback((rows)=>setQuote(q=>({...q,mdo:rows})),[setQuote]);
  const updMat=useCallback((rows)=>setQuote(q=>({...q,mat:rows})),[setQuote]);
  const subMdo=calcSub(quote.mdo),subMat=calcSub(quote.mat),total=subMdo+subMat;

  const submit=(status)=>{
    const errs=validate(quote);
    if(errs.length){setErrors(errs);setTouch({nombre:true,empresa:true,direccion:true,telefono:true});return;}
    setErrors([]);onSave(status);
  };

  const pickClient=(id)=>{
    const cl=clients.find(c=>c.id===id);
    if(cl)setQuote(q=>({...q,cliente:{nombre:cl.nombre,empresa:cl.empresa,direccion:cl.direccion,telefono:cl.telefono}}));
  };

  const reqB=(f)=>touched[f]&&!quote.cliente[f]?.trim()?"1px solid #F87171":"1px solid #E2E8F0";
  const ErrM=({f})=>touched[f]&&!quote.cliente[f]?.trim()?<div style={{fontSize:11,color:"#EF4444",marginTop:3}}>Campo requerido</div>:null;
  const fechaD=new Date(quote.fecha+"T12:00:00").toLocaleDateString("es-AR",{day:"2-digit",month:"long",year:"numeric"});

  return (
    <Pane>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
        <div>
          <H1>Nuevo Presupuesto</H1>
          {savedFlash&&<div style={{fontSize:12,color:"#059669",fontWeight:600,marginTop:-14}}>✓ Guardado</div>}
        </div>
        <div className="no-print" style={{display:"flex",gap:8}}>
          <BtnS onClick={()=>submit("borrador")} disabled={saving}>Guardar borrador</BtnS>
          <BtnP onClick={()=>submit("enviado")}  disabled={saving}>{saving?"Guardando…":"Guardar y enviar"}</BtnP>
        </div>
      </div>

      {errors.length>0&&(
        <div style={{backgroundColor:"#FEF2F2",border:"1px solid #FECACA",borderRadius:10,
          padding:"12px 16px",marginBottom:14}}>
          <div style={{fontSize:12,fontWeight:700,color:"#DC2626",marginBottom:6}}>⚠ Completá los campos obligatorios:</div>
          <ul style={{paddingLeft:16,margin:0}}>
            {errors.map((e,i)=><li key={i} style={{fontSize:12,color:"#EF4444",marginBottom:1}}>{e}</li>)}
          </ul>
        </div>
      )}

      <CardBox title="Encabezado del Presupuesto" accent={ORANGE}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:14}}>
          <div>
            <Label>N° de Presupuesto</Label>
            <div style={{backgroundColor:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:7,
              padding:"9px 12px",fontFamily:"'Oswald',system-ui",fontSize:15,fontWeight:700,
              color:NAVY,letterSpacing:"0.05em"}}>#{quote.numero}</div>
          </div>
          <div>
            <Label>Fecha de Emisión</Label>
            <div style={{backgroundColor:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:7,
              padding:"9px 12px",fontSize:13,color:"#475569"}}>{fechaD}</div>
          </div>
          <div style={{display:"flex",alignItems:"flex-end"}}>
            <div><Label>Estado</Label><Badge status={quote.status}/></div>
          </div>
        </div>
      </CardBox>

      <CardBox title="Información del Cliente" required>
        {clients.length>0&&(
          <div style={{marginBottom:14}}>
            <Label>Cargar cliente guardado</Label>
            <select onChange={e=>pickClient(e.target.value)} defaultValue=""
              style={{width:"100%",border:"1px solid #E2E8F0",borderRadius:7,padding:"8px 11px",
                fontSize:13,color:"#1E293B",backgroundColor:"#fff"}}>
              <option value="">— Completar manualmente —</option>
              {clients.map(c=><option key={c.id} value={c.id}>{c.nombre}{c.empresa?` — ${c.empresa}`:""}</option>)}
            </select>
          </div>
        )}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          {[{f:"nombre",label:"Nombre y Apellido",ph:"Juan García"},
            {f:"empresa",label:"Empresa",ph:"Empresa S.A."},
            {f:"direccion",label:"Dirección",ph:"Av. Corrientes 1234, CABA"},
            {f:"telefono",label:"Teléfono",ph:"+54 11 1234-5678"}].map(({f,label,ph})=>(
            <div key={f}>
              <Label req>{label}</Label>
              <Inp value={quote.cliente[f]} onChange={e=>updCli(f,e.target.value)} placeholder={ph} st={{border:reqB(f)}}/>
              <ErrM f={f}/>
            </div>
          ))}
        </div>
      </CardBox>

      <CardBox title="Costo de Mano de Obra" required>
        <ItemsTable rows={quote.mdo} onChange={updMdo} catalog={catalog.mdo}/>
      </CardBox>

      <CardBox title="Costo de Materiales" required>
        <ItemsTable rows={quote.mat} onChange={updMat} catalog={catalog.mat}/>
      </CardBox>

      <div style={{backgroundColor:"#fff",borderRadius:12,border:"1px solid #E2E8F0",marginBottom:14,padding:"16px 18px"}}>
        <div style={{display:"flex",justifyContent:"flex-end"}}>
          <table style={{minWidth:300}}>
            <tbody>
              {[["Subtotal Mano de Obra",subMdo],["Subtotal Materiales",subMat]].map(([l,v])=>(
                <tr key={l}>
                  <td style={{padding:"5px 0",color:"#64748B",fontSize:13}}>{l}</td>
                  <td style={{padding:"5px 0",textAlign:"right",fontWeight:500,whiteSpace:"nowrap",fontVariantNumeric:"tabular-nums"}}>$ {fmt(v)}</td>
                </tr>
              ))}
              <tr><td colSpan={2} style={{height:1,padding:0}}><div style={{height:1,backgroundColor:"#E2E8F0",margin:"6px 0"}}/></td></tr>
              <tr>
                <td style={{padding:"4px 0",fontFamily:"'Oswald',system-ui",fontSize:18,fontWeight:700,color:NAVY}}>TOTAL</td>
                <td style={{padding:"4px 0",textAlign:"right",fontFamily:"'Oswald',system-ui",fontSize:20,fontWeight:700,color:NAVY,whiteSpace:"nowrap",fontVariantNumeric:"tabular-nums"}}>$ {fmt(total)}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <CardBox title="Aclaraciones">
        <textarea value={quote.aclaraciones} onChange={e=>upd("aclaraciones",e.target.value)}
          style={{width:"100%",border:"1px solid #E2E8F0",borderRadius:7,padding:"10px 12px",
            fontSize:13,color:"#1E293B",minHeight:80,resize:"vertical",lineHeight:1.7,backgroundColor:"#fff"}}
          placeholder="Condiciones de pago, plazos, garantías, observaciones…"/>
      </CardBox>

      <div style={{display:"flex",justifyContent:"flex-end",gap:8}}>
        <BtnS onClick={()=>submit("borrador")}>Guardar borrador</BtnS>
        <BtnP onClick={()=>submit("enviado")}>Guardar y enviar</BtnP>
      </div>
    </Pane>
  );
}

// ── Tracker ───────────────────────────────────────────────────────────────────
function Tracker({quotes,onEdit,onDelete,onStatusChange,onUpdatePagos,setPrintQuote}) {
  const [dropId,setDropId]=useState(null), [expandId,setExpandId]=useState(null);
  const sorted=[...quotes].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const counts={total:quotes.length,
    enviados:quotes.filter(q=>q.status==="enviado").length,
    aprobados:quotes.filter(q=>q.status==="aprobado").length,
    rechazados:quotes.filter(q=>q.status==="rechazado").length};
  const ingresos=quotes.filter(q=>q.status==="aprobado").reduce((s,q)=>s+calcSub(q.mdo)+calcSub(q.mat),0);
  const fmtD=(d)=>d?new Date(d+"T12:00:00").toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"2-digit"}):"—";

  const PagoInp=({qid,field,value,type="number"})=>(
    <input type={type} value={value||""} onChange={e=>onUpdatePagos(qid,field,e.target.value)}
      style={{border:"none",borderBottom:"1px solid #CBD5E1",outline:"none",
        width:type==="date"?106:78,fontSize:11,padding:"3px 2px",backgroundColor:"transparent",
        textAlign:type==="number"?"right":"left",color:"#1E293B",fontVariantNumeric:"tabular-nums"}}/>
  );

  const thS={padding:"9px 10px",fontSize:10,fontWeight:700,color:"#64748B",textTransform:"uppercase",
    letterSpacing:"0.07em",backgroundColor:"#F8FAFC",borderBottom:"1px solid #E2E8F0",whiteSpace:"nowrap"};

  return (
    <Pane>
      <H1>Seguimiento de Presupuestos</H1>
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:14}}>
        {[{label:"Total",val:counts.total,color:NAVY,bg:"#fff"},
          {label:"Enviados",val:counts.enviados,color:"#1D4ED8",bg:"#EFF6FF"},
          {label:"Aprobados",val:counts.aprobados,color:"#065F46",bg:"#ECFDF5"},
          {label:"Rechazados",val:counts.rechazados,color:"#991B1B",bg:"#FFF1F2"}].map(s=>(
          <div key={s.label} style={{backgroundColor:s.bg,border:"1px solid #E2E8F0",borderRadius:10,padding:"12px 14px"}}>
            <div style={{fontSize:10,fontWeight:700,color:"#94A3B8",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:6}}>{s.label}</div>
            <div style={{fontFamily:"'Oswald',system-ui",fontSize:26,fontWeight:700,color:s.color,lineHeight:1}}>{s.val}</div>
          </div>
        ))}
      </div>
      <div style={{backgroundColor:NAVY,borderRadius:10,padding:"13px 20px",
        display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div>
          <div style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,0.4)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:3}}>Ingresos aprobados</div>
          <div style={{fontFamily:"'Oswald',system-ui",fontSize:20,fontWeight:700,color:"#fff",fontVariantNumeric:"tabular-nums"}}>$ {fmt(ingresos)}</div>
        </div>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.25)"}}>{counts.aprobados} pres. aprobado{counts.aprobados!==1?"s":""}</div>
      </div>

      {sorted.length===0?(
        <div style={{backgroundColor:"#fff",borderRadius:12,border:"1px solid #E2E8F0",textAlign:"center",padding:"48px 20px",color:"#94A3B8"}}>
          <div style={{fontSize:32,marginBottom:10}}>📋</div>
          <div style={{fontWeight:600,fontSize:14,marginBottom:4}}>Sin presupuestos todavía</div>
          <div style={{fontSize:12}}>Creá uno desde "Nuevo Presupuesto" en el menú superior</div>
        </div>
      ):(
        <div style={{backgroundColor:"#fff",borderRadius:12,border:"1px solid #E2E8F0",overflow:"hidden"}}>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead><tr>
              <th style={{...thS,textAlign:"left",width:66}}>N°</th>
              <th style={{...thS,textAlign:"left",width:76}}>Fecha</th>
              <th style={{...thS,textAlign:"left"}}>Cliente</th>
              <th style={{...thS,textAlign:"right",width:108}}>Total</th>
              <th style={{...thS,textAlign:"center",width:108}}>Estado</th>
              <th style={{...thS,textAlign:"right",width:96}}>Pago 1</th>
              <th style={{...thS,textAlign:"right",width:94}}>Resta</th>
              <th style={{...thS,textAlign:"center",width:114}}>Acciones</th>
            </tr></thead>
            <tbody>
              {sorted.map((q,ri)=>{
                const subMdo=calcSub(q.mdo),subMat=calcSub(q.mat),total=subMdo+subMat;
                const pagos=q.pagos||{pago1:"",fechaPago1:"",fechaPago2:""};
                const pago1n=parseFloat(pagos.pago1||0), resta=Math.max(0,total-pago1n);
                const stripe=ri%2===1?"#FAFBFD":"#fff", isExp=expandId===q.id;
                return [
                  <tr key={q.id+"r"} style={{backgroundColor:stripe}}
                    onMouseEnter={e=>e.currentTarget.style.backgroundColor="#F0F4FF"}

                    <td style={{padding:"10px 10px",fontFamily:"'Oswald',system-ui",fontWeight:700,color:NAVY,fontSize:13}}>#{q.numero}</td>
                    <td style={{padding:"10px 10px",fontSize:12,color:"#64748B"}}>{fmtD(q.fecha)}</td>
                    <td style={{padding:"10px 10px"}}>
                      <div style={{fontWeight:600,fontSize:13}}>{q.cliente.nombre||<span style={{color:"#CBD5E1"}}>—</span>}</div>
                      {q.cliente.empresa&&<div style={{fontSize:11,color:"#94A3B8"}}>{q.cliente.empresa}</div>}
                    </td>
                    <td style={{padding:"10px 10px",textAlign:"right",fontFamily:"'Oswald',system-ui",fontWeight:700,color:NAVY,fontSize:13,whiteSpace:"nowrap",fontVariantNumeric:"tabular-nums"}}>$ {fmt(total)}</td>
                    <td style={{padding:"10px 10px",textAlign:"center"}}>
                      <div style={{position:"relative",display:"inline-block"}}>
                        <button onClick={()=>setDropId(dropId===q.id?null:q.id)}
                          style={{display:"flex",alignItems:"center",gap:3,background:"none",border:"none",padding:2}}>
                          <Badge status={q.status}/><span style={{fontSize:9,color:"#94A3B8"}}>▾</span>
                        </button>
                        {dropId===q.id&&(
                          <div onClick={e=>e.stopPropagation()}
                            style={{position:"absolute",left:0,top:"calc(100% + 4px)",backgroundColor:"#fff",
                              border:"1px solid #E2E8F0",borderRadius:8,padding:4,zIndex:50,minWidth:140,
                              boxShadow:"0 8px 24px rgba(0,0,0,0.12)"}}>
                            {Object.entries(STATUS_MAP).map(([k,v])=>(
                              <button key={k} onClick={()=>{onStatusChange(q.id,k);setDropId(null);}}
                                style={{display:"block",width:"100%",textAlign:"left",padding:"7px 12px",
                                  background:"none",border:"none",borderRadius:5,fontSize:12,color:v.fg,fontWeight:600}}
                                onMouseEnter={e=>e.currentTarget.style.backgroundColor=v.bg}
                                onMouseLeave={e=>e.currentTarget.style.backgroundColor=""}>{v.label}</button>
                            ))}
                          </div>
                        )}
                      </div>
                    </td>
                    <td style={{padding:"10px 10px",textAlign:"right",backgroundColor:"#F0FDF4"}}>
                      <PagoInp qid={q.id} field="pago1" value={pagos.pago1}/>
                    </td>
                    <td style={{padding:"10px 10px",textAlign:"right",fontWeight:700,fontVariantNumeric:"tabular-nums",
                      backgroundColor:resta>0?"#FFF7ED":pago1n>0?"#F0FDF4":"#fff",
                      color:resta>0?"#C2410C":pago1n>0?"#065F46":"#94A3B8",
                      fontFamily:"'Oswald',system-ui",fontSize:12}}>$ {fmt(resta)}</td>
                    <td style={{padding:"10px 10px",textAlign:"center"}}>
                      <div style={{display:"flex",gap:3,justifyContent:"center"}}>
                        <button onClick={()=>setExpandId(isExp?null:q.id)} title="Detalle"
                          style={{background:"none",border:"1px solid #E2E8F0",borderRadius:5,
                            padding:"4px 8px",fontSize:11,color:isExp?ORANGE:"#475569",fontWeight:isExp?700:400}}>
                          {isExp?"▲":"▼"}</button>
                        <button onClick={()=>setPrintQuote(q)} title="Vista previa"
                          style={{background:"none",border:"1px solid #E2E8F0",borderRadius:5,padding:"4px 8px",fontSize:11,color:"#475569"}}>👁</button>
                        <button onClick={()=>onEdit(q)}
                          style={{background:"none",border:"1px solid #E2E8F0",borderRadius:5,padding:"4px 8px",fontSize:11,color:"#475569"}}>✏️</button>
                        <button onClick={()=>onDelete(q.id)}
                          style={{background:"none",border:"1px solid #FECACA",borderRadius:5,padding:"4px 8px",fontSize:11,color:"#DC2626"}}>✕</button>
                      </div>
                    </td>
                  </tr>,
                  isExp&&(
                    <tr key={q.id+"e"} style={{backgroundColor:"#F8FAFC"}}>
                      <td colSpan={8} style={{padding:"16px",borderBottom:"2px solid #E2E8F0"}}>
                        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
                          <div>
                            <div style={{fontSize:10,fontWeight:700,color:ORANGE,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:8}}>Cliente</div>
                            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"4px 14px"}}>
                              {[["Nombre",q.cliente.nombre],["Empresa",q.cliente.empresa],

                                  <div style={{fontSize:12,fontWeight:500}}>{v||"—"}</div></div>

                            </div>
                          </div>

                            <div style={{fontSize:10,fontWeight:700,color:ORANGE,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:8}}>Pagos</div>

                                  <div style={{fontSize:10,color:"#94A3B8"}}>{l}</div>

                            </div>
                          </div>
                          <div>
                            <div style={{fontSize:10,fontWeight:700,color:ORANGE,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:8}}>Mano de Obra</div>
                            {q.mdo.filter(r=>r.desc).map(r=>(

                                <span style={{fontVariantNumeric:"tabular-nums",color:NAVY,fontWeight:500}}>$ {fmt(parseFloat(r.pu||0)*parseFloat(r.qty||0))}</span>
                              </div>
                            ))}
                            <div style={{textAlign:"right",fontWeight:700,fontSize:12,color:NAVY,marginTop:4,fontVariantNumeric:"tabular-nums"}}>Subtotal: $ {fmt(subMdo)}</div>
                          </div>
                          <div>
                            <div style={{fontSize:10,fontWeight:700,color:ORANGE,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:8}}>Materiales</div>
                            {q.mat.filter(r=>r.desc).map(r=>(
                              <div key={r.id} style={{display:"flex",justifyContent:"space-between",padding:"3px 0",fontSize:12,borderBottom:"1px solid #F1F5F9"}}>
                                <span style={{color:"#475569"}}>{r.desc}</span>
                                <span style={{fontVariantNumeric:"tabular-nums",color:NAVY,fontWeight:500}}>$ {fmt(parseFloat(r.pu||0)*parseFloat(r.qty||0))}</span>
                              </div>

                            <div style={{textAlign:"right",fontWeight:700,fontSize:12,color:NAVY,marginTop:4,fontVariantNumeric:"tabular-nums"}}>Subtotal: $ {fmt(subMat)}</div>
                          </div>
                        </div>
                        {q.aclaraciones&&(
                          <div style={{marginTop:12,borderTop:"1px solid #E2E8F0",paddingTop:10}}>
                            <div style={{fontSize:10,fontWeight:700,color:"#94A3B8",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:4}}>Aclaraciones</div>
                            <div style={{fontSize:12,color:"#475569",whiteSpace:"pre-wrap"}}>{q.aclaraciones}</div>
                          </div>
                        )}
                      </td>
                    </tr>
                  )
                ];
              })}
            </tbody>
          </table>
        </div>
      )}
      {dropId&&<div onClick={()=>setDropId(null)} style={{position:"fixed",inset:0,zIndex:40}}/>}
    </Pane>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [view,setView]=useState("form");
  const [quotes,setQuotes]=useState([]);
  const [quote,setQuote]=useState(null);
  const [catalog,setCatalog]=useState({mdo:[],mat:[]});
  const [clients,setClients]=useState([]);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const [savedFlash,setSavedFlash]=useState(false);
  const [printQuote,setPrintQuote]=useState(null);

  useEffect(()=>{
    Promise.all([loadQ(),loadCat(),loadCl()]).then(([qs,cat,cls])=>{
      setQuotes(qs);setCatalog(cat);setClients(cls);
      setQuote(mkQuote(String(qs.length+1).padStart(4,"0")));
      setLoading(false);
    });
  },[]);

  const persist=useCallback(async(u)=>{setQuotes(u);await saveQ(u);},[]);

  const handleSave=useCallback(async(status)=>{
    if(!quote)return;setSaving(true);
    const updated={...quote,status};
    const idx=quotes.findIndex(q=>q.id===updated.id);
    const nl=idx>=0?quotes.map(q=>q.id===updated.id?updated:q):[...quotes,updated];
    await persist(nl);setSaving(false);setSavedFlash(true);setTimeout(()=>setSavedFlash(false),2000);
    if(status==="enviado")setQuote(mkQuote(String(nl.length+1).padStart(4,"0")));
    else setQuote(updated);
  },[quote,quotes,persist]);

  const handleEdit=useCallback((q)=>{setQuote(q);setView("form");},[]);
  const handleDelete=useCallback(async(id)=>{if(!confirm("¿Eliminar?"))return;await persist(quotes.filter(q=>q.id!==id));},[quotes,persist]);
  const handleStatus=useCallback(async(id,status)=>{await persist(quotes.map(q=>q.id===id?{...q,status}:q));},[quotes,persist]);
  const handlePagos=useCallback(async(id,f,v)=>{await persist(quotes.map(q=>q.id===id?{...q,pagos:{...(q.pagos||{}),[f]:v}}:q));},[quotes,persist]);
  const handleCatalog=useCallback(async(u)=>{setCatalog(u);await saveCat(u);},[]);
  const handleClients=useCallback(async(u)=>{setClients(u);await saveCl(u);},[]);

  if(loading)return<div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:"#94A3B8"}}>Cargando…</div>;

  const nav=[
    {id:"form",label:"Nuevo Presupuesto"},
    {id:"clients",label:"Clientes"},
    {id:"catMdo",label:"Mano de Obra"},
    {id:"catMat",label:"Materiales"},
    {id:"tracker",label:"Seguimiento"},
  ];

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100vh"}}>
      <header className="no-print" style={{backgroundColor:NAVY,flexShrink:0,display:"flex",
        alignItems:"stretch",height:56,borderBottom:`3px solid ${ORANGE}`,padding:"0 16px"}}>
        <div style={{display:"flex",alignItems:"center",gap:9,paddingRight:18,marginRight:4,
          borderRight:"1px solid rgba(255,255,255,0.07)"}}>
          <svg viewBox="0 0 48 48" fill="none" style={{width:28,height:28,flexShrink:0}}>
            <ellipse cx="24" cy="26" rx="20" ry="8" stroke="rgba(255,255,255,0.6)" strokeWidth="2.2" fill="none" transform="rotate(-20 24 26)"/>
            <path d="M28 5 L16 26 H23 L20 43 L32 22 H25 Z" fill={ORANGE}/>
          </svg>
          <div>
            <div style={{fontFamily:"'Oswald',system-ui",fontSize:14,fontWeight:700,color:"#fff",lineHeight:1,letterSpacing:"0.04em"}}>ELECTRO BC</div>
            <div style={{fontSize:7,color:"rgba(255,255,255,0.3)",letterSpacing:"0.18em",textTransform:"uppercase",marginTop:2}}>SERVICIOS INTEGRALES</div>
          </div>
        </div>
        <nav style={{display:"flex",alignItems:"stretch",flex:1}}>
          {nav.map(item=>{const a=view===item.id;return(
            <button key={item.id} onClick={()=>setView(item.id)}
              style={{display:"flex",alignItems:"center",padding:"0 13px",background:"none",border:"none",
                fontSize:12,fontWeight:a?700:400,color:a?"#fff":"rgba(255,255,255,0.45)",
                borderBottom:a?`3px solid ${ORANGE}`:"3px solid transparent",
                marginBottom:"-3px",whiteSpace:"nowrap",letterSpacing:"0.01em"}}>
              {item.label}
            </button>
          );})}
        </nav>
        <div style={{display:"flex",alignItems:"center"}}>
          <span style={{fontSize:9,color:"rgba(255,255,255,0.18)"}}>v2.0</span>
        </div>
      </header>

      <main style={{flex:1,position:"relative",overflow:"hidden",backgroundColor:"#EEF0F5"}}>
        {view==="form"    &&<QuoteForm   key="form"    quote={quote} setQuote={setQuote} onSave={handleSave} saving={saving} savedFlash={savedFlash} catalog={catalog} clients={clients}/>}
        {view==="clients" &&<ClientesView key="clients" clients={clients} onSave={handleClients}/>}
        {view==="catMdo"  &&<CatalogView  key="catMdo"  title="Catálogo · Mano de Obra" items={catalog.mdo} onSave={items=>handleCatalog({...catalog,mdo:items})}/>}
        {view==="catMat"  &&<CatalogView  key="catMat"  title="Catálogo · Materiales"   items={catalog.mat} onSave={items=>handleCatalog({...catalog,mat:items})}/>}
        {view==="tracker" &&<Tracker      key="tracker" quotes={quotes} onEdit={handleEdit} onDelete={handleDelete} onStatusChange={handleStatus} onUpdatePagos={handlePagos} setPrintQuote={setPrintQuote}/>}
      </main>

      {printQuote&&(
        <div style={{position:"fixed",inset:0,backgroundColor:"rgba(0,0,0,0.65)",zIndex:200,
          display:"flex",alignItems:"flex-start",justifyContent:"center",overflowY:"auto",padding:"24px 16px"}}>
          <div style={{width:"100%",maxWidth:780}}>
            <div className="no-print" style={{display:"flex",gap:8,justifyContent:"flex-end",marginBottom:12}}>
              <BtnP onClick={()=>window.print()}>🖨️ Imprimir</BtnP>
              <BtnS onClick={()=>setPrintQuote(null)} style={{backgroundColor:"rgba(255,255,255,0.15)",color:"#fff",border:"none"}}>✕ Cerrar</BtnS>
            </div>
            <PrintDoc q={printQuote}/>
          </div>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
