function levenshtein(a, b) {

    return null;

  }

// Add data-nav="groupId" to inputs; ↑↓ moves focus, Enter advances or saves.
function useNavKey(groupId, save) {
  // Arrow navigation is now handled globally (setupGlobalNav).
  // This hook only handles Enter → advance or save.
  return useCallback(e => {
    if (e.key === "Enter") {
      e.preventDefault();
      const all = [...document.querySelectorAll(`[data-nav="${groupId}"]`)];
      const i = all.indexOf(e.currentTarget);
      if (i < all.length - 1) {
        all[i + 1] && all[i + 1].focus();
      } else {
        save();
      }
    }
  }, [groupId, save]);
}

// ── Global arrow-key field navigation ────────────────────────────────────────
// All 4 arrows navigate between fields everywhere in the app.
// ↑↓  → always move between fields (all text-type inputs)
// ←→  → move between fields for number inputs, or when cursor is at boundary for text
function setupGlobalNav() {
  // Navigable elements: all visible, enabled text/number inputs + item-description selects
  const SEL = ['input[type=text]', 'input[type=tel]', 'input[type=email]', 'input[type=search]', 'input[type=number]', 'select[data-nav-field]' // only item-description selects get this attr
  ].join(',');
  const getAll = () => [...document.querySelectorAll(SEL)].filter(el => {
    if (el.disabled || el.readOnly) return false;
    const r = el.getBoundingClientRect();
    return r.width > 0 && r.height > 0;
  });
  // ^ Pure DOM order — matches the visual/logical field order in the form

  const handler = e => {
    const el = e.target;
    if (!el || !el.matches || !el.matches(SEL)) return;
    const isNum = el.type === 'number';
    const isSel = el.tagName === 'SELECT';
    // For text inputs, only move at cursor boundaries
    const atEnd = isSel || isNum || el.selectionStart === (el.value || '').length;
    const atStart = isSel || isNum || el.selectionStart === 0;
    let dir = 0;
    if (e.key === 'ArrowDown') dir = 1;else if (e.key === 'ArrowUp') dir = -1;else if (e.key === 'ArrowRight' && atEnd) dir = 1;else if (e.key === 'ArrowLeft' && atStart) dir = -1;
    if (!dir) return;
    const all = getAll();
    const idx = all.indexOf(el);
    if (idx === -1) return;
    const next = all[idx + dir];
    if (!next) return;
    e.preventDefault();
    next.focus();
    try {
      if (next.tagName !== 'SELECT' && next.type !== 'number' && next.select) next.select();
    } catch (_) {}
  };

  // Always re-register (handles React re-mounts cleanly)
  if (document._ebcNavHandler) document.removeEventListener('keydown', document._ebcNavHandler, true);
  document._ebcNavHandler = handler;
  document.addEventListener('keydown', handler, true);
}

<script>
(function patchDir(){
  var SKEY='ebc-quotes-v6';
  function doFill(){
    var qs=JSON.parse(localStorage.getItem(SKEY)||'[]');
    if(!qs.length)return;
    var map={};
    qs.forEach(function(q){if(q.cliente)map[q.numero]={calle:q.cliente.calle||'',num:q.cliente.numero||'',depto:q.cliente.depto||'',ref:q.referencia||''}});
    document.querySelectorAll('table tbody tr').forEach(function(row){
      var numEl=row.querySelector('td:first-child div');
      if(!numEl)return;
      var num=(numEl.textContent||'').replace('#','').trim();
      var d=map[num];if(!d)return;
      var tds=row.querySelectorAll('td');if(tds.length<4)return;
      var td=tds[3];
      if(td&&!td.textContent.trim()){
        var addr=[d.calle,d.num,d.depto?'Dto '+d.depto:''].filter(Boolean).join(' ');
        td.innerHTML=(addr?'<div style="font-size:12px;color:#475569;font-weight:500">'+addr+'</div>':'')+(d.ref?'<div style="font-size:11px;color:#94A3B8;font-style:italic">'+d.ref+'</div>':'');
      }
    });
  }
  setTimeout(doFill,1000);
  new MutationObserver(function(){setTimeout(doFill,400);}).observe(document.body,{childList:true,subtree:true});
})();
</script>
